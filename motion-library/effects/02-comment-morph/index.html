<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>02 评论形变</title>
<link rel="stylesheet" href="../../core/tokens.css">
<style>
#hero { position: absolute; left: 960px; top: 540px; width: 600px; height: 176px; margin: -88px 0 0 -300px; border-radius: 26px; background: #F6F6FA;
  display: flex; align-items: center; gap: 22px; padding: 0 30px; box-shadow: 0 30px 80px rgba(0,0,0,.5); transform-origin: 50% 50%; }
#hero .av { width: 78px; height: 78px; border-radius: 50%; flex: none; background: #2a43a8 url(../../assets/whalegirl.png) no-repeat; background-size: 180px auto; background-position: -51px -78px; }
#hero .nm { display: flex; align-items: center; gap: 10px; font: 600 22px NSC; color: #8A8DA0; }
#hero .lv { font: 700 14px Inter; color: #2fb36b; border: 2px solid #2fb36b; border-radius: 5px; padding: 0 5px; }
#hero .tx { font: 500 27px NSC; color: #15151C; margin-top: 6px; white-space: nowrap; }
#hero .tx b { color: #6A5BFF; font-weight: 600; }
.ttl { position: absolute; left: 960px; transform: translateX(-50%); font-size: 76px; color: #fff; }
#flash { background: #EFEFF3; }
</style>
</head>
<body>
<div class="mg-stage dark" id="stage">
  <div id="hero"><div class="av"></div><div><div class="nm">某某的大肥鱼<span class="lv">LV2</span></div><div class="tx"><b>本鲸</b>来交作业了，这期讲得很扎实！</div></div></div>
  <div class="mg-title ttl" id="t1" style="top:120px">这一周，B 站评论区</div>
  <div class="mg-title ttl" id="t2" style="top:222px">你应该都碰见过<span class="hl">这种账号</span></div>
  <div class="mg-fill" id="flash"></div>
</div>
<script type="module">
import { mount, cue, seg, ease, lerp, clamp, Reveal, Cursor, makeCanvas, drawDotGrid } from '../../core/mg.js';
import { CommentMorph } from './comment-morph.js';

const stage = document.getElementById('stage');
const { ctx } = makeCanvas(stage);
stage.insertBefore(ctx.canvas, stage.firstChild);
const hero = document.getElementById('hero');
const r1 = Reveal(document.getElementById('t1'), { hl: ['#C9C2FF', '#7B6BFF'] });
const r2 = Reveal(document.getElementById('t2'), { hl: ['#C9C2FF', '#7B6BFF'] });
const flash = document.getElementById('flash');
const cursor = Cursor(stage, { theme: 'dark' });

const T = { wall: [.35, 1.35], tilt: [1.25, 1.95], collapse: [1.85, 2.45], form: [2.35, 3.45], burst: [5.6, 6.3] };
const zoom = t => t < .45 ? lerp(4, 3.4, ease.outCubic(t / .45)) : lerp(3.4, .42, seg(t, .45, 1.45, ease.inOutQuint));
const morph = CommentMorph(ctx, { T, zoom, center: [960, 660], scale: 1.25 });

let hl;   // "这种账号"的位置，光标要点它
const path = () => [
  { t: 3.3, x: 1560, y: 980 }, { t: 4.1, x: hl.x, y: hl.y }, { t: 4.25, x: hl.x, y: hl.y, click: true }, { t: 5.4, x: hl.x + 40, y: hl.y + 30 },
];

cue(0.05, 'air', { dur: .7, gain: .7 });
cue(0.45, 'tickroll', { dur: .9, n: 30 });
cue(1.2, 'air', { dur: .9 });
cue(1.3, 'air', { dur: .6, gain: .4 });
cue(1.85, 'swish');
cue(2.35, 'sparkle'); cue(2.4, 'shimmer', { dur: 3 });
cue(2.4, 'air', { dur: .6, gain: .4 });
cue(3.35, 'boom', { gain: .6 });
cue(4.25, 'mouse');
cue(5.1, 'riser', { dur: .5 });
cue(5.6, 'boom'); cue(5.6, 'air', { dur: .8 });

function render(t) {
  ctx.clearRect(0, 0, 1920, 1080);
  drawDotGrid(ctx, { gap: 30, r: 1.3, color: '#1C1C2A', cam: { x: 0, y: 0, z: 1 } });
  // 开场主角卡后面的点阵光环
  const halo = 1 - seg(t, .3, .9);
  if (halo > 0) {
    const R = 330 * zoom(t) / 4;
    ctx.fillStyle = `rgba(142,125,255,${.55 * halo})`;
    for (let k = 0; k < 3; k++) for (let a = 0; a < 72; a++) {
      const ang = a / 72 * Math.PI * 2, rr = R + k * 22;
      ctx.beginPath(); ctx.arc(960 + Math.cos(ang) * rr * 1.5, 540 + Math.sin(ang) * rr, 2, 0, 7); ctx.fill();
    }
  }
  morph.render(t);
  hero.style.transform = `scale(${zoom(t) / 4})`;
  hero.style.opacity = 1 - seg(t, .55, .8);
  r1(seg(t, 1.3, 2.0)); r2(seg(t, 2.35, 3.1));
  if (t > 5.5) { r1(seg(t, 5.5, 5.85), { out: true }); r2(seg(t, 5.5, 5.85), { out: true }); }
  cursor.at(t, path());
  cursor.el.style.opacity = Math.min(+cursor.el.style.opacity, 1 - seg(t, 5.6, 5.9));
  flash.style.opacity = seg(t, 5.95, 6.35, ease.inQuad);
}
mount({
  duration: 6.6, render,
  prepare: async () => {
    await document.fonts.ready;
    r2(1);
    const b = document.querySelector('#t2 .hl').getBoundingClientRect();
    hl = { x: b.x + b.width * .55, y: b.y + b.height * .7 };
    r2(0);
  },
});
</script>
</body>
</html>
